<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoPulse Widget</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <div class="repo-pulse" data-theme="terminal">
        <div class="repo-pulse__toolbar">
          <span class="repo-pulse__brand">Repo Pulse</span>
          <div class="repo-pulse__swatches" aria-label="Choose a color theme">
            <button
              class="repo-pulse__swatch repo-pulse__swatch--cyan"
              type="button"
              data-theme="terminal"
              aria-label="Terminal theme"
              aria-pressed="true"
            ></button>
            <button
              class="repo-pulse__swatch repo-pulse__swatch--magenta"
              type="button"
              data-theme="spooky"
              aria-label="Spooky theme"
              aria-pressed="false"
            ></button>
            <button
              class="repo-pulse__swatch repo-pulse__swatch--yellow"
              type="button"
              data-theme="light"
              aria-label="Light theme"
              aria-pressed="false"
            ></button>
            <button
              class="repo-pulse__swatch repo-pulse__swatch--black"
              type="button"
              data-theme="dark"
              aria-label="Dark theme"
              aria-pressed="false"
            ></button>
          </div>
        </div>

        <article class="repo-pulse__content">
          <div class="repo-pulse__project-panel">
            <header class="repo-pulse__header">
              <h2>SchemaBind</h2>
              <span class="repo-pulse__status">
                <span class="repo-pulse__status-dot" aria-hidden="true"></span>
                Active
              </span>
            </header>

            <ul class="repo-pulse__updates">
              <li class="repo-pulse__update-item">
                <span>Improved CSV field handling.</span>
                <time datetime="2026-06-15">Updated 2 days ago</time>
              </li>
              <li class="repo-pulse__update-item">
                <span>Updated attribute access to use the new API.</span>
                <time datetime="2026-06-14">Updated 3 days ago</time>
              </li>
              <li class="repo-pulse__update-item">
                <span>Added clearer errors for missing fields.</span>
                <time datetime="2026-06-12">Updated 5 days ago</time>
              </li>
            </ul>
          </div>

          <footer class="repo-pulse__footer">
            <span>3 recent changes</span>
            <a href="#"
              >View on GitHub <span aria-hidden="true">&rarr;</span></a
            >
          </footer>
        </article>
      </div>
    </main>
  </body>
</html>
